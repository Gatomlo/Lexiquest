<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aperçu décors — avant / après</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px;background:#f4f1ea;color:#222}
h1{font-size:18px}h2{font-size:15px;margin:22px 0 8px}
.row{display:flex;gap:14px;flex-wrap:wrap}
figure{margin:0}figcaption{font-size:12px;font-weight:700;margin-bottom:4px}
.card{width:300px;height:200px;border-radius:18px;border:1px solid #0002;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;box-sizing:border-box;--surface:#fff}
.pet{width:70px;height:70px;border-radius:50%;background:#FF9418;border:3px solid #333;position:relative}
.pet:before,.pet:after{content:"";position:absolute;top:24px;width:9px;height:9px;border-radius:50%;background:#333}
.pet:before{left:18px}.pet:after{right:18px}

/* ===== AVANT (actuel) ===== */
.old-foret{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 62%,#2F8F5B),color-mix(in srgb,var(--surface) 55%,#A3D977))}
.old-plage{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 55%,#8FD0FF) 0 58%,color-mix(in srgb,var(--surface) 45%,#FFD98A) 58%)}

<h1>Décors : avant / après (aperçu, rien n’est encore modifié dans l’app)</h1>

<h2>1. Forêt enchantée (150 gemmes)</h2>
<div class="row">
<figure><figcaption>Avant</figcaption><div class="card old-foret"><div class="pet"></div></div></figure>
<figure><figcaption>Après</figcaption><div class="card new-foret"><div class="pet"></div></div></figure>
</div>

<h2>2. Plage (220 gemmes)</h2>
<div class="row">
<figure><figcaption>Avant</figcaption><div class="card old-plage"><div class="pet"></div></div></figure>
<figure><figcaption>Après</figcaption><div class="card new-plage"><div class="pet"></div></div></figure>
</div>
